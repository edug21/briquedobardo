<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brique do Bardo</title>
<link rel="icon" type="image/svg+xml" href="__FAVICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Plakat Fraktur";src:url(__FONT__) format("woff2");font-display:swap}
:root{
  /* Ferro negro, vermelho-sangue e bronze sobre marfim: interface de RPG gótico, contida. Layout: cabeçalho com sigilo, abas de estilo, grade de slots à esquerda e painel do item selecionado fixo à direita. */
  --iron:#0a0a0a;
  --iron-2:#121111;
  --iron-3:#1a1817;
  --crimson:#d94a4a;
  --bronze:#cab592;
  --ivory:#e6e0d4;
  --gray:#7d7d7d;
  --line:rgba(202,181,146,.22);
  --title:"Plakat Fraktur",serif;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --heading:"Cormorant Garamond",Garamond,Georgia,serif;
  --body:"EB Garamond",Garamond,Georgia,serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(ellipse 60% 40% at 50% -5%,rgba(217,74,74,.10),transparent 70%),
    radial-gradient(ellipse 50% 60% at 100% 40%,rgba(217,74,74,.05),transparent 70%),
    var(--iron);
  color:var(--ivory);font:18px/1.5 var(--body);
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--crimson);outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}

/* Ornamento: linha com losango central */
.orn{display:flex;align-items:center;gap:12px;color:var(--crimson)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(217,74,74,.7))}
.orn::after{transform:scaleX(-1)}
.orn svg{flex:none}

/* Cabeçalho */
.head{text-align:center;padding:30px 0 6px}
.sigil{display:block;margin:0 auto 4px;color:var(--crimson);filter:drop-shadow(0 0 10px rgba(217,74,74,.45))}
.head h1{margin:0;font:400 clamp(44px,7vw,78px)/1 var(--title);color:var(--ivory);letter-spacing:.01em}
.head .sub{margin:12px 0 0;font:500 12px/1.6 var(--display);letter-spacing:.28em;text-transform:uppercase;color:var(--bronze)}
.head .lead{margin:6px auto 0;max-width:60ch;color:var(--gray);font-style:italic;font-size:17px}
.head .orn{max-width:640px;margin:16px auto 0}

/* Barra de navegação estilo menu de jogo */
.bar{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;min-height:56px}
.tabs{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;background:none;border:0;padding:18px 12px 16px;cursor:pointer;font:500 12px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--gray);transition:color .25s var(--ease)}
.tab:hover{color:var(--ivory)}
.tab[aria-pressed="true"]{color:var(--crimson)}
.tab sup{font-family:var(--body);letter-spacing:0;font-size:12px;margin-left:4px;color:var(--gray)}
.ink{position:absolute;bottom:0;height:2px;background:var(--crimson);box-shadow:0 0 12px var(--crimson),0 0 2px var(--crimson);transition:transform .35s var(--ease),width .35s var(--ease);pointer-events:none}
.ink::after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;background:var(--crimson);transform:translateX(-50%) rotate(45deg)}
.res{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:10px 26px;margin:16px 0 4px;font:500 14px/1 var(--display);color:var(--ivory);font-variant-numeric:tabular-nums}
.res span{display:flex;align-items:center;gap:7px;white-space:nowrap}
.res small{font-size:10px;letter-spacing:.16em;color:var(--gray);text-transform:uppercase}
.res i{width:7px;height:7px;transform:rotate(45deg);background:var(--bronze);display:block}
.bagbtn{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);padding:9px 14px;cursor:pointer;font:500 11px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--ivory);transition:border-color .25s,background-color .25s}
.bagbtn:hover{border-color:var(--crimson);background:rgba(217,74,74,.08)}
.bagbtn b{font:600 13px/1 var(--display);color:var(--crimson);min-width:14px;text-align:center}

/* Layout principal */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;padding-top:24px;padding-bottom:64px;align-items:start}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:0 2px;transition:border-color .25s}
.search:focus-within{border-color:var(--crimson)}
.search input{flex:1;background:none;border:0;outline:none;padding:10px 0;min-width:0;font-size:18px}
.search input::placeholder{color:#5e5a55;font-style:italic}
.search svg{color:var(--bronze)}
select{background:var(--iron-2);border:1px solid var(--line);padding:9px 10px;font:500 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ivory)}
.count{font:500 11px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gray);margin:14px 0 0}
.group{margin-top:26px}
.ghead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ghead h2{margin:0;font:500 15px/1 var(--display);letter-spacing:.24em;color:var(--bronze)}
.ghead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ghead small{order:3;font:400 13px var(--body);color:var(--gray);font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}

.slot{position:relative;display:flex;flex-direction:column;gap:8px;padding:0;background:none;border:0;cursor:pointer;text-align:left;color:inherit;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 18ms)}
@keyframes rise{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}
.well{position:relative;aspect-ratio:1;border:1px solid rgba(202,181,146,.28);background:var(--iron-2);padding:4px;transition:border-color .25s var(--ease),box-shadow .25s var(--ease)}
.well::before,.well::after{content:"";position:absolute;width:8px;height:8px;border:1px solid var(--bronze);opacity:.0;transition:opacity .25s,inset .25s var(--ease)}
.well::before{top:-4px;left:-4px;border-right:0;border-bottom:0}
.well::after{bottom:-4px;right:-4px;border-left:0;border-top:0}
.slot:hover .well{border-color:rgba(202,181,146,.6)}
.slot:hover .well::before,.slot:hover .well::after{opacity:1}
.slot[aria-current="true"] .well{border-color:var(--crimson);box-shadow:0 0 0 1px var(--crimson),0 0 22px rgba(217,74,74,.35),inset 0 0 18px rgba(217,74,74,.25)}
.slot[aria-current="true"] .well::before,.slot[aria-current="true"] .well::after{opacity:1;border-color:var(--crimson)}
.slot.reserved{opacity:.4}
.cover{position:relative;width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:9px 9px 9px 14px;transition:transform .5s var(--ease)}
.slot:hover .cover{transform:scale(1.03)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(0,0,0,.45)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.7))}
.cover.img::before,.cover.img::after{display:none}
.disc{position:absolute;right:-30%;top:-30%;width:88%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.6) 0 9%,rgba(230,224,212,.14) 9.5% 11%,rgba(230,224,212,.04) 11.5% 60%,rgba(230,224,212,.1) 61% 62%,transparent 63%)}
.cover .bn{position:relative;z-index:1;font:500 14px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ivory);text-wrap:balance}
.mark{position:absolute;top:7px;left:12px;z-index:1;font:500 9px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ivory);background:rgba(10,10,10,.7);border:1px solid rgba(202,181,146,.35);padding:3px 5px}
.mark.imp{border-color:rgba(217,74,74,.6);color:#f0b3b3}
.cap{display:flex;flex-direction:column;gap:2px;padding:0 1px}
.cap .t{font:600 17px/1.15 var(--heading);color:var(--ivory);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .p{font:500 12px/1.3 var(--display);letter-spacing:.06em;color:var(--bronze);font-variant-numeric:tabular-nums}
.empty{padding:60px 0;text-align:center;color:var(--gray);font-style:italic}

/* Painel do item */
.panel{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin;border:1px solid var(--line);background:linear-gradient(180deg,var(--iron-3),var(--iron-2));padding:22px}
.ptop{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:end}
.panel .corner{position:absolute;width:14px;height:14px;border:1px solid var(--bronze)}
.panel .c1{top:-1px;left:-1px;border-right:0;border-bottom:0}.panel .c2{top:-1px;right:-1px;border-left:0;border-bottom:0}
.panel .c3{bottom:-1px;left:-1px;border-right:0;border-top:0}.panel .c4{bottom:-1px;right:-1px;border-left:0;border-top:0}
.pin{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.pcover{aspect-ratio:1;border:1px solid rgba(202,181,146,.35);padding:4px}
.pcover .cover .bn{font-size:15px}
.pcover .cover .an{display:none}
.kind{font:500 11px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--crimson)}
.panel h3{margin:8px 0 2px;font:600 26px/1.05 var(--heading);color:var(--ivory);text-wrap:balance}
.panel .by{color:var(--gray);font-style:italic}
.stats{list-style:none;margin:16px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:grid;gap:7px}
.stats li{display:grid;grid-template-columns:18px 108px 1fr;align-items:center;gap:8px;font-size:16px}
.stats svg{color:var(--bronze);opacity:.85}
.stats .k{font:500 10px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--gray)}
.stats .v{color:var(--ivory);text-align:right}
.meter{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.meter .pips{display:flex;gap:4px}
.meter .pips i{width:7px;height:7px;transform:rotate(45deg);background:#2b2826}
.meter .pips i.on{background:var(--crimson);box-shadow:0 0 6px rgba(217,74,74,.7)}
.obs{margin-top:14px;font-style:italic;color:#bdb6a8;font-size:16px;padding-left:12px;border-left:1px solid var(--crimson)}
.alt{margin-top:10px;font-size:15px;color:var(--gray)}
.alt button{background:none;border:0;padding:0;color:var(--bronze);text-decoration:underline;cursor:pointer;font:inherit}
.buy{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.price{font:500 26px/1 var(--display);color:var(--ivory);font-variant-numeric:tabular-nums}
.price.q{font-size:14px;letter-spacing:.14em;color:var(--gray);text-transform:uppercase}
.btn{position:relative;cursor:pointer;border:1px solid var(--crimson);background:linear-gradient(180deg,rgba(217,74,74,.22),rgba(217,74,74,.08));color:var(--ivory);font:500 11px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;padding:14px 18px;transition:background-color .25s,box-shadow .25s;text-decoration:none;text-align:center}
.btn:hover{background:rgba(217,74,74,.3);box-shadow:0 0 18px rgba(217,74,74,.35)}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.btn.line{border-color:var(--line);background:none}
.btn.line:hover{border-color:var(--bronze);box-shadow:none}
.hints{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px;font-size:13px;color:var(--gray)}
.hints span{display:inline-flex;align-items:center;gap:6px}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border:1px solid rgba(202,181,146,.45);border-radius:11px;font:500 10px/1 var(--display);color:var(--ivory)}
.pclose{display:none}

/* Sacola */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.bag{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--iron-2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column}
.bag.on{transform:none}
.bag header{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 10px}
.bag h3{margin:0;font:500 16px/1 var(--display);letter-spacing:.3em;text-transform:uppercase;color:var(--ivory)}
.bag .orn{padding:0 22px}
.items{flex:1;overflow:auto;padding:6px 22px}
.it{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it .sw{width:48px;height:48px;border:1px solid rgba(202,181,146,.35)}
.it .t{font:600 17px/1.15 var(--heading)}
.it .s{font-size:14px;color:var(--gray)}
.it .rm{background:none;border:0;padding:0;color:var(--gray);text-decoration:underline;cursor:pointer;font-size:14px}
.it .p{font:500 14px var(--display);color:var(--bronze)}
.bag footer{padding:18px 22px 22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font:500 11px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gray)}
.tot b{font:500 26px var(--display);letter-spacing:0;color:var(--ivory)}
.note{font-size:14px;color:var(--gray);font-style:italic}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);z-index:40;opacity:0;transition:opacity .25s,transform .25s var(--ease);pointer-events:none;background:var(--iron-3);border:1px solid var(--crimson);padding:10px 18px;font:500 11px var(--display);letter-spacing:.2em;text-transform:uppercase}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer.site-foot{border-top:1px solid var(--line);padding-block:18px;color:var(--gray);font-size:15px}
.site-foot-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.sf-copy{margin:0}
.sf-link{display:inline-flex;align-items:center;gap:8px;color:var(--gray);text-decoration:none;padding:6px 8px;margin:-6px -8px;transition:color .2s}
.sf-link svg{width:13px;height:15px}
.sf-link:hover{color:var(--ivory)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media (max-width:1020px){
  .stage{grid-template-columns:1fr}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:25;max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .35s var(--ease);border-width:1px 0 0}
  .panel.on{transform:none}
  .pclose{display:block;position:absolute;top:12px;right:12px;width:34px;height:34px;background:var(--iron);border:1px solid var(--line);color:var(--ivory);cursor:pointer}
  .hints{display:none}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
  .cap .t{font-size:15px}
  .site-foot-in{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="head wrap">
  <svg class="sigil" width="54" height="34" viewBox="0 0 54 34" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4"><path d="M27 2 L27 32"/><path d="M27 6 L16 1 M27 6 L38 1"/><path d="M27 12 L8 4 L13 14 M27 12 L46 4 L41 14"/><path d="M27 20 L2 14 L12 24 M27 20 L52 14 L42 24"/><path d="M22 28 L27 33 L32 28"/></g></svg>
  <h1>Brique do Bardo</h1>
  <p class="sub">CDs · DVDs · Importados · Raridades</p>
  <p class="lead">Brique de CDs e DVDs usados. Estado do encarte e mídia descrito em cada item.</p>
  <div class="orn" aria-hidden="true"><svg width="26" height="12" viewBox="0 0 26 12"><path d="M13 0 L17 6 L13 12 L9 6 Z" fill="currentColor"/><path d="M0 6 H8 M18 6 H26" stroke="currentColor"/></svg></div>
  <div class="res" id="res"></div>
</header>

<nav class="bar" aria-label="Estilos e sacola">
  <div class="wrap">
    <div class="tabs" id="tabs" role="group" aria-label="Estilo"><span class="ink" id="ink"></span></div>
    <button class="bagbtn" id="openBag" aria-label="Abrir sacola">Sacola <b id="bagN">0</b></button>
  </div>
</nav>

<main class="wrap stage">
  <section aria-label="Acervo">
    <div class="tools">
      <label class="search" for="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Buscar banda, álbum ou gravadora" autocomplete="off"></label>
      <select id="fmt" aria-label="Formato"><option value="">Todos os formatos</option><option value="CD">CD</option><option value="Video">DVD / Blu-ray</option></select>
      <select id="sort" aria-label="Ordenar"><option value="az">Banda A–Z</option><option value="lo">Menor preço</option><option value="hi">Maior preço</option><option value="new">Mais recentes</option><option value="old">Mais antigos</option></select>
    </div>
    <p class="count" id="count"></p>
    <div id="list"></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite" aria-label="Item selecionado">
    <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <button class="pclose" id="pclose" aria-label="Fechar detalhes">×</button>
    <div id="pin"></div>
    <div class="hints" aria-hidden="true">
      <span><kbd>←</kbd><kbd>→</kbd> Navegar</span>
      <span><kbd>Enter</kbd> Pôr na sacola</span>
      <span><kbd>S</kbd> Sacola</span>
      <span><kbd>/</kbd> Buscar</span>
    </div>
  </aside>
</main>

<footer class="site-foot">
  <div class="wrap site-foot-in">
    <p class="sf-copy">© 2026 Eduardo Gouvêa · Designed, built, and shipped with AI</p>
    <a class="sf-link" href="https://www.eduardogouvea.com" target="_blank" rel="noopener"><svg viewBox="0 0 70 80" aria-hidden="true" focusable="false"><path fill="currentColor" d="M0 0V57.142H58.3304V68.5681H11.6637V62.8551H0V80H70V39.372H58.3363V45.7159H11.6637V34.2898H69.9941V0H0ZM58.3304 22.858H11.6637V11.4319H58.3304V22.858Z"/></svg><span>eduardogouvea.com</span><span class="sr-only"> (abre em nova aba)</span></a>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="bag" id="bag" aria-label="Sacola">
  <header><h3>Sacola</h3><button class="btn line" id="closeBag">Fechar</button></header>
  <div class="orn" aria-hidden="true"><svg width="26" height="12" viewBox="0 0 26 12"><path d="M13 0 L17 6 L13 12 L9 6 Z" fill="currentColor"/><path d="M0 6 H8 M18 6 H26" stroke="currentColor"/></svg></div>
  <div class="items" id="items"></div>
  <footer id="bagFoot"></footer>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = __DATA__;
const WHATS = '5551996696158';
const $ = id => document.getElementById(id);
const BRL = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isVideo = d => d.tipo==='DVD' || d.tipo==='Blu-ray';
const discos = {Simples:1,Duplo:2,Triplo:3};
const GRADE = {'Excelente':4,'Ótimo':3,'Bom':2,'Regular':1,'Ruim':1};

const FAM = [
  ['Power Metal',/power/i],['Heavy Metal',/heavy/i],['Thrash',/thrash/i],['Death',/death/i],
  ['Black',/black/i],['Prog',/prog/i],['Folk',/folk/i],['Sinfônico',/symphonic/i],
  ['Hard Rock',/hard rock|blues/i],['Nu / Alternativo',/nu metal|alternativo|metalcore|moderno/i],
  ['Pop e outros',/pop|axé|hip hop|punk|rock & roll|^rock$|synth/i]
];
DATA.forEach(d=>{ d.fams=FAM.filter(([,r])=>r.test(d.estilo)).map(([n])=>n); if(!d.fams.length) d.fams=['Pop e outros']; });

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function coverBg(d){if(d.capa)return `center/cover no-repeat url('${d.capa}')`;const h=hue(d.banda);return `radial-gradient(ellipse 90% 70% at 30% 20%,hsl(${h} 22% 26%),transparent 70%),linear-gradient(160deg,hsl(${h} 18% 17%),hsl(${(h+20)%360} 14% 7%))`}
function cover(d,big=false){
  const m=[];
  if(d.reservado) m.push('<span class="mark">Reservado</span>');
  else if(d.versao==='Importado') m.push('<span class="mark imp">Importado</span>');
  else if(isVideo(d)) m.push(`<span class="mark">${esc(d.tipo)}</span>`);
  return `<div class="cover${d.capa?' img':''}" style="background:${coverBg(d)}" ${d.capa?`role="img" aria-label="Capa de ${esc(d.album)}"`:''}>${d.capa?'':'<span class="disc"></span>'}${big?'':m.join('')}${d.capa?'':`<div class="bn">${esc(d.banda)}</div>${big?`<div class="an">${esc(d.album)}</div>`:''}`}</div>`;
}

const st={q:'',fmt:'',sort:'az',fam:'',sel:null};
let bag=[];
try{bag=JSON.parse(localStorage.getItem('briqueCart')||'[]').filter(id=>DATA.some(d=>d.id===id))}catch(e){}
const saveBag=()=>{try{localStorage.setItem('briqueCart',JSON.stringify(bag))}catch(e){}};

// Recursos (contadores)
(function(){
  const nac=DATA.filter(d=>d.versao==='Nacional').length, imp=DATA.length-nac;
  const bands=new Set(DATA.map(d=>d.banda)).size;
  $('res').innerHTML=[[DATA.length,'Itens',1],[bands,'Bandas'],[nac,'Nacionais'],[imp,'Importados']].map(([n,l,k])=>`<span${k?' class="keep"':''}><i></i>${n} <small>${l}</small></span>`).join('');
})();

// Abas com sublinhado deslizante
const tabs=$('tabs'), ink=$('ink');
tabs.insertAdjacentHTML('beforeend',`<button class="tab" aria-pressed="true" data-f="">Todos</button>`+FAM.map(([n])=>`<button class="tab" aria-pressed="false" data-f="${n}">${n}<sup>${DATA.filter(d=>d.fams.includes(n)).length}</sup></button>`).join(''));
function moveInk(){const a=tabs.querySelector('[aria-pressed="true"]');if(!a)return;ink.style.width=a.offsetWidth+'px';ink.style.transform=`translateX(${a.offsetLeft}px)`}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;st.fam=b.dataset.f;tabs.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));moveInk();b.scrollIntoView({inline:'nearest',block:'nearest'});render()});
addEventListener('resize',moveInk);
document.fonts&&document.fonts.ready.then(moveInk);

$('q').addEventListener('input',e=>{st.q=e.target.value;render()});
$('fmt').addEventListener('change',e=>{st.fmt=e.target.value;render()});
$('sort').addEventListener('change',e=>{st.sort=e.target.value;render()});

const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function filtered(){
  const q=norm(st.q.trim());
  const r=DATA.filter(d=>{
    if(q && !norm([d.banda,d.album,d.gravadora,d.estilo,d.obs].join(' ')).includes(q)) return false;
    if(st.fmt==='CD' && isVideo(d)) return false;
    if(st.fmt==='Video' && !isVideo(d)) return false;
    if(st.fam && !d.fams.includes(st.fam)) return false;
    return true;
  });
  const az=(a,b)=>a.banda.localeCompare(b.banda,'pt')||a.album.localeCompare(b.album,'pt')||a.id-b.id;
  const s={az,lo:(a,b)=>(a.preco||1e9)-(b.preco||1e9)||az(a,b),hi:(a,b)=>b.preco-a.preco||az(a,b),new:(a,b)=>(b.ano||0)-(a.ano||0)||az(a,b),old:(a,b)=>(a.ano||9999)-(b.ano||9999)||az(a,b)}[st.sort];
  return r.sort(s);
}
let idx=0;
function slot(d){
  return `<button class="slot${d.reservado?' reserved':''}" data-id="${d.id}" style="--i:${Math.min(idx++,40)}" aria-current="${d.id===st.sel}" aria-label="${esc(d.banda)} – ${esc(d.album)}, ${d.preco?BRL(d.preco):'preço sob consulta'}">
    <div class="well">${cover(d)}</div>
    <div class="cap"><span class="t">${esc(d.album)}</span><span class="p">${d.preco?BRL(d.preco):'Sob consulta'}</span></div></button>`;
}
function render(){
  const r=filtered(); idx=0;
  $('count').textContent=`${r.length} de ${DATA.length} itens`;
  const list=$('list');
  if(!r.length){list.innerHTML='<div class="empty">Nenhum disco encontrado com essa busca.</div>';return}
  if(!r.some(d=>d.id===st.sel)) select(r[0].id,false);
  if(st.sort==='az'){
    const g={};r.forEach(d=>{const L=/[A-Z]/i.test(d.banda[0])?d.banda[0].toUpperCase():'#';(g[L]=g[L]||[]).push(d)});
    list.innerHTML=Object.entries(g).map(([L,a])=>`<section class="group"><div class="ghead"><h2>${L}</h2><small>${a.length} ${a.length>1?'itens':'item'}</small></div><div class="grid">${a.map(slot).join('')}</div></section>`).join('');
  } else list.innerHTML=`<div class="grid" style="margin-top:20px">${r.map(slot).join('')}</div>`;
}

// Painel
const ic={
  cal:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  flag:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  disc:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/></svg>',
  seal:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l2.5 2 3-.5.5 3 2 2.5-2 2.5-.5 3-3-.5L12 21l-2.5-2-3 .5-.5-3-2-2.5 2-2.5.5-3 3 .5z"/></svg>',
  box:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16"/><path d="M8 4v16"/></svg>',
  page:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/></svg>',
  rune:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v18M12 8l5-4M12 8 7 4"/></svg>'
};
const meter=g=>`<span class="meter">${esc(g||'—')}<span class="pips">${[1,2,3,4].map(i=>`<i class="${i<=(GRADE[g]||0)?'on':''}"></i>`).join('')}</span></span>`;
function select(id,open=true){
  st.sel=id; const d=DATA.find(x=>x.id===id); if(!d) return;
  document.querySelectorAll('.slot[aria-current="true"]').forEach(s=>s.setAttribute('aria-current','false'));
  const el=document.querySelector(`.slot[data-id="${id}"]`); if(el) el.setAttribute('aria-current','true');
  const inBag=bag.includes(id);
  const others=DATA.filter(x=>x.id!==id&&x.banda===d.banda&&x.album===d.album);
  $('pin').innerHTML=`<div class="pin">
    <div class="ptop"><div class="pcover">${cover(d,true)}</div>
    <div><div class="kind">${esc(d.versao)}${d.origem?` · ${esc(d.origem)}`:''}</div>
    <h3>${esc(d.album)}</h3><div class="by">${esc(d.banda)}</div></div></div>
    <ul class="stats">
      <li>${ic.cal}<span class="k">Lançamento</span><span class="v">${d.ano??'—'}${d.anoVersao&&d.anoVersao!==d.ano?` · ed. ${d.anoVersao}`:''}</span></li>
      <li>${ic.rune}<span class="k">Estilo</span><span class="v">${esc(d.estilo)}</span></li>
      <li>${ic.flag}<span class="k">País</span><span class="v">${esc(d.pais)}</span></li>
      <li>${ic.seal}<span class="k">Gravadora</span><span class="v">${esc(d.gravadora)}</span></li>
      <li>${ic.box}<span class="k">Formato</span><span class="v">${esc(d.tipo)} · ${esc(d.qtde)}</span></li>
      <li>${ic.page}<span class="k">Encarte</span><span class="v">${meter(d.encarte)}</span></li>
      <li>${ic.disc}<span class="k">Mídia</span><span class="v">${meter(d.midia)}</span></li>
    </ul>
    ${d.obs?`<div class="obs">${esc(d.obs)}</div>`:''}
    ${others.length?`<div class="alt">Também à venda: ${others.map(o=>`<button data-go="${o.id}">${esc(o.versao)} ${esc(o.origem)}, ${o.preco?BRL(o.preco):'sob consulta'}</button>`).join(' · ')}</div>`:''}
    <div class="buy"><span class="price${d.preco?'':' q'}">${d.preco?BRL(d.preco):'Sob consulta'}</span>
      <button class="btn" id="add" ${d.reservado?'disabled':''}>${d.reservado?'Reservado':inBag?'Na sacola':'Pôr na sacola'}</button></div>
  </div>`;
  $('pin').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(+b.dataset.go));
  $('add').onclick=()=>addToBag(id);
  if(open && matchMedia('(max-width:1020px)').matches){ $('panel').classList.add('on'); }
}
function addToBag(id){
  const d=DATA.find(x=>x.id===id); if(!d||d.reservado) return;
  if(!bag.includes(id)){bag.push(id);saveBag();updateBag();toast('Guardado na sacola')} else toast('Já está na sacola');
  if(st.sel===id && $('add')) $('add').textContent='Na sacola';
}
$('pclose').onclick=()=>$('panel').classList.remove('on');

// Grade: clique seleciona, setas navegam, Enter guarda
const list=$('list');
list.addEventListener('click',e=>{const s=e.target.closest('.slot');if(s) select(+s.dataset.id)});
list.addEventListener('keydown',e=>{
  const s=e.target.closest('.slot'); if(!s) return;
  if(e.key==='Enter'){e.preventDefault();addToBag(+s.dataset.id);return}
  const all=[...list.querySelectorAll('.slot')], i=all.indexOf(s); let n=null;
  if(e.key==='ArrowRight') n=all[i+1];
  else if(e.key==='ArrowLeft') n=all[i-1];
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const r=s.getBoundingClientRect(), down=e.key==='ArrowDown';
    const cand=all.filter(x=>{const q=x.getBoundingClientRect();return down?q.top>r.top+5:q.top<r.top-5});
    if(cand.length){const rowTop=down?Math.min(...cand.map(x=>x.getBoundingClientRect().top)):Math.max(...cand.map(x=>x.getBoundingClientRect().top));
      n=cand.filter(x=>Math.abs(x.getBoundingClientRect().top-rowTop)<5).sort((a,b)=>Math.abs(a.getBoundingClientRect().left-r.left)-Math.abs(b.getBoundingClientRect().left-r.left))[0];}
  } else return;
  e.preventDefault();
  if(n){n.focus({preventScroll:false});n.scrollIntoView({block:'nearest'});select(+n.dataset.id,false)}
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='Escape'){closeBag();$('panel').classList.remove('on');return}
  if(typing) return;
  if(e.key==='/'){e.preventDefault();$('q').focus()}
  if(e.key==='s'||e.key==='S'){openBag()}
});

// Sacola
const bagEl=$('bag'),scrim=$('scrim');
function openBag(){bagEl.classList.add('on');scrim.classList.add('on');$('closeBag').focus()}
function closeBag(){bagEl.classList.remove('on');scrim.classList.remove('on')}
$('openBag').onclick=openBag;$('closeBag').onclick=closeBag;scrim.onclick=closeBag;
function orderText(){
  const it=bag.map(id=>DATA.find(d=>d.id===id)), tot=it.reduce((s,d)=>s+d.preco,0);
  return `Olá! Tenho interesse nestes itens do Brique do Bardo:\n${it.map(d=>`• ${d.banda} – ${d.album} (${d.versao} ${d.origem||''}, ${d.tipo}) – ${d.preco?BRL(d.preco):'sob consulta'}`).join('\n')}\n\nTotal: ${BRL(tot)}${it.some(d=>!d.preco)?' + itens sob consulta':''}`;
}
function updateBag(){
  $('bagN').textContent=bag.length;
  const it=bag.map(id=>DATA.find(d=>d.id===id));
  if(!it.length){$('items').innerHTML='<p class="note" style="padding:20px 0">A sacola está vazia. Selecione um disco e use "Pôr na sacola".</p>';$('bagFoot').innerHTML='';return}
  $('items').innerHTML=it.map(d=>`<div class="it"><span class="sw" style="background:${coverBg(d)}"></span><div><div class="t">${esc(d.album)}</div><div class="s">${esc(d.banda)} · ${esc(d.versao)}</div><button class="rm" data-rm="${d.id}">Remover</button></div><span class="p">${d.preco?BRL(d.preco):'Consulta'}</span></div>`).join('');
  const tot=it.reduce((s,d)=>s+d.preco,0), msg=orderText();
  $('bagFoot').innerHTML=`<div class="tot"><span>${it.length} ${it.length>1?'itens':'item'}</span><b>${BRL(tot)}</b></div>
    ${it.some(d=>!d.preco)?'<div class="note">Inclui item com preço sob consulta.</div>':''}
    <a class="btn" href="https://wa.me/${WHATS}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a>
    <button class="btn line" id="copy">Copiar lista do pedido</button>
    <div class="note">Pedido enviado para o WhatsApp (51) 99669-6158. Frete e forma de pagamento são combinados na conversa.</div>`;
  $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);toast('Lista copiada')}catch(e){toast('Não foi possível copiar')}};
}
$('items').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;bag=bag.filter(id=>id!==+b.dataset.rm);saveBag();updateBag();if(st.sel) select(st.sel,false)});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1700)}

render();updateBag();moveInk();
</script>
</body>
</html>
