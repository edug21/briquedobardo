<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brique CDs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* Um balcão de sebo: prateleira escura, etiquetas de preço em latão, capas geradas por banda. Layout: barra de filtros fixa + grade de "caixinhas" agrupadas por letra. */
  --bg:#15171b;
  --shelf:#1d2026;
  --line:#2e323a;
  --ink:#ecebe6;
  --muted:#9a9ca3;
  --brass:#d9a441;
  --ok:#6fbf8a; --warn:#d9a441; --bad:#e0685a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

header.top{border-bottom:1px solid var(--line);padding:22px 0 18px}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand h1{font:900 clamp(40px,7vw,68px)/.85 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--brass)}
.brand p{margin:8px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font:800 30px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.cartbtn{display:flex;align-items:center;gap:10px;background:var(--brass);color:#1a1408;border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer}
.cartbtn .n{background:#1a1408;color:var(--brass);border-radius:99px;min-width:24px;padding:0 7px;font:500 13px/24px var(--mono);text-align:center}

.filters{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;flex-direction:column;gap:10px;padding-top:12px;padding-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--shelf);border:1px solid var(--line);border-radius:6px;padding:0 12px}
.search input{flex:1;background:none;border:0;padding:10px 0;outline:none;min-width:0}
.search svg{flex:none;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--shelf);border:0;padding:9px 12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
select{background:var(--shelf);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.price{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.price input{accent-color:var(--brass);width:120px}
.price output{font-family:var(--mono);color:var(--ink);min-width:62px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,transparent)}
.chip .c{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}

main.wrap{padding-top:8px;padding-bottom:64px}
.count{color:var(--muted);font-size:13px;margin:14px 0 0}
.letter{display:flex;align-items:baseline;gap:14px;margin:28px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.letter h2{font:900 44px/1 var(--display);margin:0;color:var(--brass)}
.letter small{color:var(--muted);font-family:var(--mono);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}

.card{display:flex;flex-direction:column;background:var(--shelf);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#4a4f59}
.card.res{opacity:.55}
.cover{position:relative;aspect-ratio:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 12px 12px 22px;overflow:hidden;color:#fff}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.35);box-shadow:inset -1px 0 rgba(255,255,255,.15)}
.cover .disc{position:absolute;right:-28%;top:-28%;width:85%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.5) 0 9%,rgba(255,255,255,.18) 9.5% 11%,rgba(255,255,255,.06) 11.5% 60%,rgba(255,255,255,.12) 61% 62%,transparent 63%)}
.cover .bn{font:900 26px/.9 var(--display);text-transform:uppercase;letter-spacing:.01em;position:relative;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.cover .an{font-size:12px;opacity:.85;margin-top:6px;position:relative;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{position:absolute;top:10px;left:20px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 30px)}
.tag{font:600 10px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-radius:3px;background:rgba(0,0,0,.55);color:#fff}
.tag.lac{background:var(--brass);color:#1a1408}
.tag.res{background:#fff;color:#000}
.meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta .t{font-weight:600;line-height:1.3}
.meta .s{color:var(--muted);font-size:12.5px;line-height:1.35}
.meta .bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;gap:8px}
.pr{font:500 17px/1 var(--mono);color:var(--brass);font-variant-numeric:tabular-nums}
.pr.q{font-size:12px;color:var(--muted)}
.cond{display:flex;gap:6px;font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:0}
.g-Excelente{background:var(--ok)} .g-Ótimo{background:#a6c46a} .g-Bom{background:var(--warn)} .g-Ruim{background:var(--bad)} .g-{background:var(--line)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}

/* modal / drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}
.scrim.on{display:block}
.modal{position:fixed;z-index:21;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--shelf);border:1px solid var(--line);border-radius:10px;display:none}
.modal.on{display:grid;grid-template-columns:minmax(0,280px) 1fr}
.modal .mcov{position:relative;display:flex}
.modal .cover{aspect-ratio:auto;min-height:280px;flex:1}
.modal .cover .bn{font-size:38px}
.modal .cover .an{font-size:14px;-webkit-line-clamp:4}
.mbody{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.mbody h3{margin:0;font:800 28px/1.05 var(--display);text-wrap:balance}
.mbody .by{color:var(--muted);margin-top:-8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0}
.obs{background:var(--bg);border-left:3px solid var(--brass);padding:8px 12px;font-size:14px;border-radius:0 4px 4px 0}
.mact{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto}
.mact .pr{font-size:26px}
.primary{background:var(--brass);color:#1a1408;border:0;border-radius:6px;padding:11px 18px;font-weight:600;cursor:pointer}
.primary[disabled]{opacity:.5;cursor:default}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:18px;z-index:2}

.drawer{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--shelf);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer h3{margin:0;font:800 26px/1 var(--display);text-transform:uppercase}
.items{flex:1;overflow:auto;padding:8px 18px}
.it{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it .sw{width:44px;height:44px;border-radius:4px}
.it .t{font-weight:600;font-size:14px;line-height:1.25}
.it .s{color:var(--muted);font-size:12px}
.it .rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:0;text-decoration:underline}
.drawer footer{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font:500 24px/1 var(--mono);color:var(--brass)}
.note{font-size:12px;color:var(--muted)}
.drawer footer a.primary{text-align:center;text-decoration:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:640px){
  .modal.on{grid-template-columns:1fr}
  .modal .cover{min-height:200px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .cover .bn{font-size:21px}
  .stats{gap:16px}
}
/* Rodapé do autor */
footer.site-foot{padding-block:18px;border-top:1px solid var(--line);background:var(--shelf);color:var(--muted);font-size:13px}
.site-foot-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.sf-copy{margin:0}
.sf-link{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;padding:6px 8px;margin:-6px -8px;border-radius:6px;transition:color .2s,background-color .2s}
.sf-link svg{width:13px;height:15px;flex:none}
.sf-link:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.sf-link:focus-visible{outline:2px solid var(--brass);outline-offset:2px;color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-width:640px){.site-foot-in{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="wrap">
    <div class="brand">

    <button class="cartbtn" id="openCart" aria-label="Abrir sacola"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Sacola <span class="n" id="cartN">0</span></button>

<div class="filters">

<footer class="site-foot" id="site-foot">

<div class="scrim" id="scrim"></div>

  <div class="items" id="items"></div>

</aside>

const BRL = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isJP = d => d.origem==='Japão' || /OBI|Japon/i.test(d.obs);
const isVideo = d => d.tipo==='DVD' || d.tipo==='Blu-ray';
const discos = {Simples:1,Duplo:2,Triplo:3};

// Estilos agrupados em famílias para os filtros
const FAM = [
  ['Power Metal',/power/i],['Heavy Metal',/heavy/i],['Thrash',/thrash/i],['Death',/death/i],
  ['Black',/black/i],['Prog',/prog/i],['Folk',/folk/i],['Sinfônico',/symphonic/i],
  ['Hard Rock',/hard rock|blues/i],['Nu / Alternativo',/nu metal|alternativo|metalcore|moderno/i],
  ['Pop e outros',/pop|axé|hip hop|punk|rock & roll|^rock$|synth/i]
];
DATA.forEach(d=>{ d.fams = FAM.filter(([,r])=>r.test(d.estilo)).map(([n])=>n); if(!d.fams.length) d.fams=['Pop e outros']; });

// Capa gerada: cor estável por banda
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function coverBg(d){const h=hue(d.banda);const h2=(h+40)%360;return `linear-gradient(150deg,hsl(${h} 45% 34%),hsl(${h2} 50% 16%))`}
function coverHTML(d,withTags=true){
  const tags=[];
  if(d.reservado) tags.push('<span class="tag res">Reservado</span>');
  if(d.versao==='Importado') tags.push('<span class="tag">Importado</span>');
  if(/lacrado/i.test(d.obs)) tags.push('<span class="tag lac">Lacrado</span>');
  if(isVideo(d)) tags.push(`<span class="tag">${esc(d.tipo)}</span>`);
  if(discos[d.qtde]>1) tags.push(`<span class="tag">${discos[d.qtde]} discos</span>`);
  return `<div class="cover" style="background:${coverBg(d)}"><span class="disc"></span>${withTags?`<div class="tags">${tags.join('')}</div>`:''}<div class="bn">${esc(d.banda)}</div><div class="an">${esc(d.album)}</div></div>`;
}
const priceHTML = d => d.preco>0 ? `<span class="pr">${BRL(d.preco)}</span>` : `<span class="pr q">Sob consulta</span>`;
const grade = g => `<span class="dot g-${esc(g)}"></span>${esc(g||'—')}`;

// Estado
const st={q:'',fmt:'',sort:'az',fams:new Set()};
let cart=[];
try{cart=JSON.parse(localStorage.getItem('briqueCart')||'[]').filter(id=>DATA.some(d=>d.id===id))}catch(e){}
const saveCart=()=>{try{localStorage.setItem('briqueCart',JSON.stringify(cart))}catch(e){}};

// Stats
(function(){
  const imp=DATA.filter(d=>d.versao==='Importado').length, nac=DATA.filter(d=>d.versao==='Nacional').length;
  const bands=new Set(DATA.map(d=>d.banda)).size;
  document.getElementById('stats').innerHTML=[[DATA.length,'itens'],[bands,'bandas'],[nac,'nacionais'],[imp,'importados']].map(([n,l])=>`<div class="stat"><b>${n}</b><small>${l}</small></div>`).join('');
})();

// Chips de estilo
const chipsEl=document.getElementById('chips');
chipsEl.innerHTML=FAM.map(([n])=>`<button class="chip" aria-pressed="false" data-f="${n}">${n}<span class="c">${DATA.filter(d=>d.fams.includes(n)).length}</span></button>`).join('');
chipsEl.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const f=b.dataset.f;st.fams.has(f)?st.fams.delete(f):st.fams.add(f);b.setAttribute('aria-pressed',st.fams.has(f));render()});

document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;render()});
document.getElementById('fmt').addEventListener('change',e=>{st.fmt=e.target.value;render()});
document.getElementById('sort').addEventListener('change',e=>{st.sort=e.target.value;render()});

const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function filtered(){
  const q=norm(st.q.trim());
  let r=DATA.filter(d=>{
    if(q && !norm([d.banda,d.album,d.gravadora,d.estilo,d.obs].join(' ')).includes(q)) return false;
    if(st.fmt==='CD' && isVideo(d)) return false;
    if(st.fmt==='Video' && !isVideo(d)) return false;
    if(st.fams.size && !d.fams.some(f=>st.fams.has(f))) return false;
    return true;
  });
  const az=(a,b)=>a.banda.localeCompare(b.banda,'pt')||a.album.localeCompare(b.album,'pt')||a.id-b.id;
  const s={az,lo:(a,b)=>(a.preco||1e9)-(b.preco||1e9)||az(a,b),hi:(a,b)=>b.preco-a.preco||az(a,b),new:(a,b)=>(b.ano||0)-(a.ano||0)||az(a,b),old:(a,b)=>(a.ano||9999)-(b.ano||9999)||az(a,b)}[st.sort];
  return r.sort(s);
}
function card(d){
  return `<button class="card${d.reservado?' res':''}" data-id="${d.id}" aria-label="${esc(d.banda)} – ${esc(d.album)}">
    ${coverHTML(d)}
    <div class="meta">
      <div class="t">${esc(d.album)}</div>
      <div class="s">${esc(d.banda)} · ${d.ano??''}${d.anoVersao&&d.anoVersao!==d.ano?` (ed. ${d.anoVersao})`:''}<br>${esc(d.versao)} · ${esc(d.origem||'—')} · ${esc(d.tipo)}</div>
      <div class="bot">${priceHTML(d)}<div class="cond" title="Encarte / Mídia"><span>${grade(d.encarte)}</span></div></div>
    </div></button>`;
}
function render(){
  const r=filtered();
  document.getElementById('count').textContent=`${r.length} de ${DATA.length} itens`;
  const list=document.getElementById('list');
  if(!r.length){list.innerHTML=`<div class="empty">Nenhum item com esses filtros.<br><button class="ghost" id="clr">Limpar filtros</button></div>`;document.getElementById('clr').onclick=clearAll;return}
  if(st.sort==='az'){
    const groups={};r.forEach(d=>{const L=/[A-Z]/i.test(d.banda[0])?d.banda[0].toUpperCase():'#';(groups[L]=groups[L]||[]).push(d)});
    list.innerHTML=Object.entries(groups).map(([L,arr])=>`<section><div class="letter"><h2>${L}</h2><small>${arr.length} ${arr.length>1?'itens':'item'}</small></div><div class="grid">${arr.map(card).join('')}</div></section>`).join('');
  } else list.innerHTML=`<div class="grid" style="margin-top:20px">${r.map(card).join('')}</div>`;
}
function clearAll(){
  st.q='';st.fmt='';st.fams.clear();
  document.getElementById('q').value='';document.getElementById('fmt').value='';
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false'));
  render();
}

// Modal
const modal=document.getElementById('modal'),scrim=document.getElementById('scrim'),drawer=document.getElementById('drawer');
let lastFocus=null;
document.getElementById('list').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openItem(+c.dataset.id)});
function openItem(id){
  const d=DATA.find(x=>x.id===id); lastFocus=document.activeElement;
  const inCart=cart.includes(id);
  // outras versões do mesmo álbum
  const others=DATA.filter(x=>x.id!==id&&x.banda===d.banda&&x.album===d.album);
  modal.innerHTML=`<div class="mcov">${coverHTML(d)}<button class="x" id="mx" aria-label="Fechar">×</button></div>
  <div class="mbody">
    <h3 id="mTitle">${esc(d.album)}</h3><div class="by">${esc(d.banda)}</div>
    <dl>
      <dt>Lançamento</dt><dd>${d.ano??'—'}${d.anoVersao&&d.anoVersao!==d.ano?` · esta edição de ${d.anoVersao}`:''}</dd>
      <dt>Estilo</dt><dd>${esc(d.estilo)}</dd>
      <dt>País da banda</dt><dd>${esc(d.pais)}</dd>
      <dt>Versão</dt><dd>${esc(d.versao)} · prensagem ${esc(d.origem||'não informada')}</dd>
      <dt>Gravadora</dt><dd>${esc(d.gravadora)}</dd>
      <dt>Formato</dt><dd>${esc(d.tipo)} · ${esc(d.qtde)}${discos[d.qtde]>1?` (${discos[d.qtde]} discos)`:''}</dd>
      <dt>Encarte</dt><dd>${grade(d.encarte)}</dd>
      <dt>Mídia</dt><dd>${grade(d.midia)}</dd>
    </dl>
    ${d.obs?`<div class="obs">${esc(d.obs)}</div>`:''}
    ${others.length?`<div class="note">Também temos ${others.length===1?'outra versão':others.length+' outras versões'} deste álbum: ${others.map(o=>`<a href="#" data-go="${o.id}" style="color:var(--brass)">${esc(o.versao)} ${esc(o.origem)}, ${esc(o.tipo)} (${o.preco?BRL(o.preco):'sob consulta'})</a>`).join(' · ')}</div>`:''}
    <div class="mact">${priceHTML(d)}
      <button class="primary" id="madd" ${d.reservado?'disabled':''}>${d.reservado?'Reservado':inCart?'Na sacola ✓':'Adicionar à sacola'}</button>
    </div>
  </div>`;
  modal.classList.add('on');scrim.classList.add('on');
  document.getElementById('mx').onclick=closeAll;
  modal.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();openItem(+a.dataset.go)});
  const add=document.getElementById('madd');
  add.onclick=()=>{ if(!cart.includes(id)){cart.push(id);saveCart();updateCart();toast('Adicionado à sacola')} add.textContent='Na sacola ✓'; };
  add.focus();
}
function closeAll(){modal.classList.remove('on');drawer.classList.remove('on');scrim.classList.remove('on');if(lastFocus)lastFocus.focus()}
scrim.onclick=closeAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

// Sacola
document.getElementById('openCart').onclick=()=>{lastFocus=document.activeElement;modal.classList.remove('on');drawer.classList.add('on');scrim.classList.add('on');document.getElementById('closeCart').focus()};
document.getElementById('closeCart').onclick=closeAll;
function orderText(){
  const items=cart.map(id=>DATA.find(d=>d.id===id));
  const lines=items.map(d=>`• ${d.banda} – ${d.album} (${d.versao} ${d.origem||''}, ${d.tipo}) – ${d.preco?BRL(d.preco):'sob consulta'}`);
  const tot=items.reduce((s,d)=>s+d.preco,0);
  return `Olá! Tenho interesse nestes itens da Brique CDs:\n${lines.join('\n')}\n\nTotal: ${BRL(tot)}${items.some(d=>!d.preco)?' + itens sob consulta':''}`;
}
function updateCart(){
  document.getElementById('cartN').textContent=cart.length;
  const items=cart.map(id=>DATA.find(d=>d.id===id));
  const el=document.getElementById('items'),ft=document.getElementById('cartFoot');
  if(!items.length){el.innerHTML='<p class="note" style="padding:20px 0">Sua sacola está vazia. Toque em um disco para ver os detalhes e adicionar.</p>';ft.innerHTML='';return}
  el.innerHTML=items.map(d=>`<div class="it"><span class="sw" style="background:${coverBg(d)}"></span><div><div class="t">${esc(d.album)}</div><div class="s">${esc(d.banda)} · ${esc(d.versao)} ${esc(d.origem)}</div><button class="rm" data-rm="${d.id}">Remover</button></div>${priceHTML(d)}</div>`).join('');
  const tot=items.reduce((s,d)=>s+d.preco,0);
  const msg=orderText();
  ft.innerHTML=`<div class="tot"><span>${items.length} ${items.length>1?'itens':'item'}</span><b>${BRL(tot)}</b></div>
    ${items.some(d=>!d.preco)?'<div class="note">Inclui item com preço sob consulta.</div>':''}
    <a class="primary" href="https://wa.me/5551996696158?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a>
    <button class="ghost" id="copy">Copiar lista do pedido</button>
    <div class="note">Pedido enviado para o WhatsApp (51) 99669-6158. Frete e forma de pagamento são combinados na conversa.</div>`;
  document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);toast('Lista copiada')}catch(e){toast('Não foi possível copiar. Use o botão do WhatsApp.')}};
}
document.getElementById('items').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;cart=cart.filter(id=>id!==+b.dataset.rm);saveCart();updateCart()});
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}

render();updateCart();
</script>
</body>
</html>
